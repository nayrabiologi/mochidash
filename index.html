
<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mochi Dash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header>
      <span class="logo">Mochi Dash</span>
      <span class="best">BEST <b id="best">0</b></span>
    </header>

    <div class="score">SCORE <b id="score">0</b></div>

    <div class="game-area" id="gameArea">
      <canvas id="canvas"></canvas>
      <div class="start-screen" id="startScreen">
        <div class="cat-emoji">🐈</div>
        <h2 id="message">let's go!</h2>
        <p>jump over the plants </p>
        <button id="startBtn">let's run with Mochi!</button>
      </div>
    </div>

    <p class="hint">SPACE / TAP TO JUMP</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
